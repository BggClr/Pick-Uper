name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test tests/PickUper.Core.Tests/PickUper.Core.Tests.csproj

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Native AOT needs the MSVC linker, which only ships with Windows, so this
      # build (unlike the trimmed/ReadyToRun one) can't be cross-compiled from
      # macOS/Linux — it has to run on a windows-latest runner.
      - name: Publish Native AOT (${{ matrix.rid }})
        shell: bash
        run: ./scripts/build.sh -r ${{ matrix.rid }} -a

      - uses: actions/upload-artifact@v7
        with:
          name: pick-uper-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/pick-uper.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts into distinct filenames
        run: |
          mkdir -p release
          mv dist/pick-uper-win-x64/pick-uper.exe release/pick-uper-win-x64.exe
          mv dist/pick-uper-win-x86/pick-uper.exe release/pick-uper-win-x86.exe

      # Every push to main gets its own tag/release, versioned by this workflow's
      # run number (1.0.<N>) — a permanent, ever-growing history instead of one
      # release whose assets keep getting replaced.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: 1.0.${{ github.run_number }}
          name: 1.0.${{ github.run_number }}
          body: |
            Automated Native AOT build of `main` @ ${{ github.sha }}.
            Self-contained, single-file exe — no .NET runtime needed on the target machine.
          make_latest: true
          files: release/*.exe
